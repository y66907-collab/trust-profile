<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>העתקת התיבה</title>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
  button { font: inherit; padding: 10px 24px; cursor: pointer; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h2>העתקת התיבה למחשב שלך</h2>
<p>אחרי האישור המיילים נשמרים בתיקייה במחשב שלך בלבד. בסיום ההרשאה מבוטלת. צריך להשאיר את הלשונית פתוחה עד הסוף.</p>
<button id="go" hidden>אישור ב-Google</button>
<p id="status" role="status"></p>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// Hands a Gmail token to the script that opened this page on this computer, and to nothing else.
// The port and one-time code arrive in the URL fragment, which browsers never send to a server.
const SCOPE = "https://www.googleapis.com/auth/gmail.readonly";
const params = new URLSearchParams(location.hash.slice(1));
const port = params.get("port"), code = params.get("code"), hint = params.get("hint") || undefined;
history.replaceState(null, "", location.pathname);
const go = document.getElementById("go"), statusEl = document.getElementById("status");
const say = (text) => { statusEl.textContent = text; };

function bridge(path, options = {}) {
  return fetch(`http://127.0.0.1:${port}${path}`, { ...options, headers: { ...options.headers, "x-code": code } });
}

let client, waiting = false, triedSilent = false, ended = false;
function tokenClient() {
  client = client || google.accounts.oauth2.initTokenClient({
    client_id: window.IMTRUSTME.googleClientId,
    scope: SCOPE,
    hint,
    callback: async (t) => {
      waiting = false;
      if (t.error || !google.accounts.oauth2.hasGrantedAllScopes(t, SCOPE)) {
        go.hidden = false;
        return say("לא התקבלה ההרשאה. אפשר לנסות שוב, ולסמן את ההרשאה בחלון של Google.");
      }
      try {
        await bridge("/token", { method: "POST", body: JSON.stringify({ token: t.access_token }) });
        go.hidden = true;
        triedSilent = false;
        say("מתחילים להעתיק…");
      } catch {
        go.hidden = false;
        say("הדפדפן לא הצליח להעביר את ההרשאה לסקריפט. אפשר לנסות שוב.");
      }
    },
    error_callback: () => {
      waiting = false;
      go.hidden = false;
      say("חלון האישור של Google לא הושלם. אפשר ללחוץ שוב על הכפתור.");
    },
  });
  return client;
}

function requestToken(prompt) {
  if (!window.google?.accounts?.oauth2) return say("החלון של Google עוד לא נטען. אפשר לנסות שוב בעוד רגע.");
  waiting = true;
  tokenClient().requestAccessToken(prompt === undefined ? {} : { prompt });
}
go.addEventListener("click", () => requestToken());

let approved = false;
async function poll() {
  if (ended) return;
  try {
    const state = await (await bridge("/state")).json();
    if (state.status) say(state.status);
    if (state.done) { ended = true; go.hidden = true; return; }
    if (state.need && !waiting) {
      if (!approved) go.hidden = false; // the first approval needs a click, or the browser blocks the window
      else if (!triedSilent) { triedSilent = true; requestToken(""); }
    }
    if (!state.need) { approved = true; go.hidden = true; }
  } catch {
    go.hidden = true;
    say("אין חיבור לסקריפט במחשב. אם הדפדפן שואל על גישה לרשת המקומית, צריך לאשר. אם הסקריפט נעצר, הקישור הזה כבר לא פעיל.");
  }
  setTimeout(poll, 3000);
}

if (port && code) poll();
else say("הדף הזה נפתח רק מתוך הסקריפט שרץ במחשב.");
</script>
</body>
</html>
