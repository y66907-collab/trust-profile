<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>סביבת פיתוח</title>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="font:18px/1.6 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px">
<p id="lab-status">טוען…</p>
<script>
// Development shell for the report page. Opened only by test/live-lab.js, which runs on this computer.
// It runs the page's current local code on the owner's real mailbox and reports a trace of the run to that script.
// The port and one-time code arrive in the URL fragment, which browsers never send to a server.
"use strict";
(async () => {
  const fromHash = new URLSearchParams(location.hash.slice(1));
  if (fromHash.get("code")) {
    sessionStorage.setItem("lab", JSON.stringify({ port: fromHash.get("port"), code: fromHash.get("code") }));
    history.replaceState(null, "", location.pathname);
  }
  const labStatus = (t) => { const el = document.getElementById("lab-status"); if (el) el.textContent = t; };
  const session = JSON.parse(sessionStorage.getItem("lab") || "null");
  if (!session) return labStatus("הדף הזה נפתח רק מתוך הסקריפט שרץ במחשב.");

  const realFetch = window.fetch.bind(window);
  const LAB = `http://127.0.0.1:${session.port}`;
  const lab = (p, options = {}) => realFetch(LAB + p, { ...options, headers: { ...options.headers, "x-code": session.code } });
  const post = (p, body) => lab(p, { method: "POST", body: typeof body === "string" ? body : JSON.stringify(body) });

  // ---- the trace: identifiers, counts and step names, never a mail's text
  const pending = [];
  const t0 = performance.now();
  const trace = (entry) => pending.push({ t: Math.round(performance.now() - t0), ...entry });
  setInterval(() => { if (pending.length) post("/trace", pending.splice(0)).catch(() => {}); }, 1000);
  const scrub = (a) => String(a?.message || a).replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[email]").replace(/Bearer\s+\S+/g, "Bearer [token]").slice(0, 300);
  for (const level of ["warn", "error"]) {
    const real = console[level].bind(console);
    console[level] = (...a) => { trace({ k: "console", level, text: a.map(scrub).join(" ") }); real(...a); };
  }
  addEventListener("error", (e) => trace({ k: "pageerror", text: scrub(e.message) }));
  addEventListener("unhandledrejection", (e) => trace({ k: "pageerror", text: scrub(e.reason) }));

  // ---- the code under test comes from this computer, so a change needs no publishing
  let files;
  try {
    const names = ["index.html", "app.js", "worker.js", "style.css", "engine/engine.py", "engine/pilot.py", "engine/senders.json", "engine/labels.json", "engine/rules.json", "engine/excluded_hashes.json"];
    files = Object.fromEntries(await Promise.all(names.map(async (n) => {
      const r = await lab(`/site/${n}`);
      if (!r.ok) throw new Error(n);
      return [n, await r.text()];
    })));
  } catch {
    return labStatus("אין חיבור לסקריפט במחשב. אם הדפדפן שואל על גישה לרשת המקומית, צריך לאשר ולרענן.");
  }

  // ---- Gmail: every answer is kept in the script's memory for the next round, paced like the page itself
  const GMAIL = "https://gmail.googleapis.com/";
  const UNIT_MS = 11;
  let nextSlot = 0, penalty = 0;
  async function waitSlot(units) {
    const now = Date.now(), at = Math.max(now, nextSlot);
    nextSlot = at + units * UNIT_MS;
    if (at > now) await new Promise((r) => setTimeout(r, at - now));
  }
  function describe(url) {
    const u = new URL(url), p = u.pathname;
    const out = { q: u.searchParams.get("q") || undefined, label: u.searchParams.get("labelIds") || undefined, format: u.searchParams.get("format") || undefined, page: u.searchParams.get("pageToken") ? true : undefined };
    if (p.endsWith("/profile")) return { what: "profile", ...out };
    if (p.endsWith("/messages")) return { what: "list", ...out };
    const att = /messages\/([^/]+)\/attachments\//.exec(p);
    if (att) return { what: "attachment", id: att[1], ...out };
    return { what: "message", id: p.split("/").pop(), ...out };
  }
  function resultOf(info, text) {
    if (info.what !== "list") return {};
    const ids = (JSON.parse(text).messages || []).map((m) => m.id);
    return { n: ids.length, ids };
  }
  let savedToken = "";
  async function gmailFetch(url, init) {
    const info = describe(url);
    const hit = await post("/cache/get", { key: url });
    if (hit.ok) {
      const text = await hit.text();
      trace({ k: "gmail", cached: true, ...info, ...resultOf(info, text) });
      return new Response(text, { status: 200, headers: { "content-type": "application/json" } });
    }
    await waitSlot(info.what === "list" || info.what === "profile" ? 5 : 20);
    const res = await realFetch(url, init);
    if (!res.ok) {
      trace({ k: "gmail", status: res.status, ...info });
      if (res.status === 401) { savedToken = ""; post("/token/clear", "{}").catch(() => {}); }
      if (res.status === 429 || res.status === 403) { penalty = Math.min(penalty * 2 || 5000, 60000); nextSlot = Date.now() + penalty; }
      return res;
    }
    penalty = 0;
    const text = await res.text();
    trace({ k: "gmail", ...info, ...resultOf(info, text) });
    await post("/cache/put", { key: url, value: text });
    return new Response(text, { status: 200, headers: { "content-type": "application/json" } });
  }
  // Outside calls are kept too, so a round repeats them only when what they ask for changed. Feedback is never sent.
  async function sendFetch(url, init) {
    const kind = (() => { try { return JSON.parse(init.body).kind; } catch { return "?"; } })();
    if (kind === "imtrustme-pilot-feedback") {
      trace({ k: "outside", kind, blocked: true });
      return new Response('{"ok":true}', { status: 200, headers: { "content-type": "application/json" } });
    }
    const key = `${url}\n${init.body}`;
    const hit = await post("/cache/get", { key });
    if (hit.ok) { trace({ k: "outside", kind, cached: true }); return new Response(await hit.text(), { status: 200 }); }
    const res = await realFetch(url, init);
    trace({ k: "outside", kind, status: res.status });
    if (!res.ok) return res;
    const text = await res.text();
    await post("/cache/put", { key, value: text });
    return new Response(text, { status: 200 });
  }
  window.fetch = (input, init = {}) => {
    const url = String(input?.url || input);
    if (url.startsWith(GMAIL)) return gmailFetch(url, init);
    if (url === window.IMTRUSTME.sendUrl) return sendFetch(url, init);
    if (/^https?:/.test(url)) trace({ k: "outside", host: new URL(url).host });
    return realFetch(input, init);
  };

  // ---- the engine: same worker, with its files from this computer. What it is given is kept for quick engine reruns.
  const workerSource = (() => {
    const engineFiles = Object.fromEntries(Object.entries(files).filter(([n]) => n.startsWith("engine/")));
    return `const __files = ${JSON.stringify(engineFiles)};
const __fetch = self.fetch.bind(self);
self.fetch = (u, o) => __files[u] !== undefined ? Promise.resolve(new Response(__files[u])) : __fetch(u, o);
${files["worker.js"]}`;
  })();
  const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: "text/javascript" }));
  const RealWorker = window.Worker;
  window.Worker = class extends RealWorker {
    constructor(url, options) {
      const mine = String(url) === "worker.js";
      super(mine ? workerUrl : url, options);
      if (!mine) return;
      this.addEventListener("message", (e) => {
        if (e.data.type === "result") { trace({ k: "engine", phase: "result" }); post("/capture/result", e.data.result).catch(() => {}); }
        if (e.data.type === "error") trace({ k: "engine", phase: "error", text: scrub(e.data.error) });
      });
      const send = this.postMessage.bind(this);
      this.postMessage = (m) => {
        if (m.type === "run") { trace({ k: "engine", phase: "run", rows: m.payload.rows?.length }); post("/capture/payload", m.payload).catch(() => {}); }
        send(m);
      };
    }
  };

  // ---- Google: one approval is reused until it runs out, so a new round asks for nothing
  let state = await (await lab("/state")).json();
  savedToken = state.token || "";
  function wrapGoogle() {
    const oauth = window.google.accounts.oauth2;
    const realInit = oauth.initTokenClient, realGranted = oauth.hasGrantedAllScopes;
    oauth.initTokenClient = (o) => {
      const client = realInit({ ...o, callback: (t) => {
        if (t.access_token) { savedToken = t.access_token; post("/token", { token: t.access_token }).catch(() => {}); trace({ k: "signin", approved: true }); }
        o.callback(t);
      } });
      return { requestAccessToken: (a) => {
        if (savedToken) return setTimeout(() => o.callback({ access_token: savedToken, __lab: true }), 0);
        client.requestAccessToken(a);
      } };
    };
    oauth.hasGrantedAllScopes = (t, ...scopes) => t.__lab === true || realGranted(t, ...scopes);
    oauth.revoke = (_t, done) => { if (done) done(); }; // the script revokes when it stops
  }
  while (!window.google?.accounts?.oauth2) await new Promise((r) => setTimeout(r, 100));
  wrapGoogle();

  // ---- the page itself, unchanged. It no longer needs its own pacing, since the layer above paces real calls only.
  const parsed = new DOMParser().parseFromString(files["index.html"], "text/html");
  parsed.querySelectorAll("script").forEach((s) => s.remove());
  document.body.removeAttribute("style");
  document.body.replaceChildren(...parsed.body.children);
  const style = document.createElement("style");
  style.textContent = files["style.css"];
  document.head.append(style);
  const app = document.createElement("script");
  app.text = `${files["app.js"].replace("UNIT_MS = 11;", "UNIT_MS = 0;")}\n//# sourceURL=app.js`;
  document.body.append(app);

  for (const name of ["stage", "go"]) {
    const real = window[name];
    if (real) window[name] = (...a) => { trace({ k: name, args: a.map((x) => String(x).slice(0, 40)) }); return real(...a); };
  }
  document.getElementById("details-next").addEventListener("click", () => {
    const value = (id) => document.getElementById(id).value;
    post("/details", { he: value("name-he"), en: value("name-en"), hasHh: document.getElementById("has-hh").checked, hh: value("hh-name") }).catch(() => {});
  }, true);

  // ---- a new round skips the screens already answered
  if (state.details) {
    const d = state.details;
    document.getElementById("name-he").value = d.he;
    document.getElementById("name-en").value = d.en;
    if (d.hasHh) {
      const box = document.getElementById("has-hh");
      box.checked = true;
      box.dispatchEvent(new Event("change", { bubbles: true }));
      document.getElementById("hh-name").value = d.hh;
    }
    window.go("s-details");
    document.getElementById("details-next").click();
    if (savedToken) document.getElementById("connect").click();
  }

  // ---- report the finished run, and reload when the script asks for a new round
  const reported = { first: false, final: false };
  const summarize = () => ({ run: S.run, result: S.result });
  setInterval(() => {
    if (typeof S === "undefined") return;
    if (!reported.first && S.result && S.run) { reported.first = true; post("/capture/report", { stage: "first", ...summarize() }).catch(() => {}); }
    if (!reported.final && S.background) {
      reported.final = true;
      S.background.then(() => { trace({ k: "finished" }); return post("/capture/report", { stage: "final", ...summarize() }); }).catch((e) => trace({ k: "pageerror", text: scrub(e) }));
    }
  }, 1000);
  const round = state.round;
  setInterval(async () => {
    try {
      state = await (await lab("/state")).json();
      if (state.round !== round) { window.onbeforeunload = null; location.reload(); }
    } catch { /* the script stopped, and the page stays as it is */ }
  }, 2000);
})();
</script>
</body>
</html>
