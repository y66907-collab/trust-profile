<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creds · כל מקורות האימות</title>
<style>
  :root {
    --bg:#f5f8fc; --card:#fff; --ink:#0f1d33; --muted:#5b6b82; --line:#dfe6f0;
    --blue:#1f5eff; --blue-soft:#e8efff; --ok:#0f8a5f; --ok-soft:#e3f5ee; --warn:#b4540a; --warn-soft:#fdf0e3;
    --soon:#7a6bd1; --soon-soft:#efecfb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0c1422; --card:#142035; --ink:#e8eef8; --muted:#9aabc4; --line:#24334d;
      --blue:#6b95ff; --blue-soft:#1a2b4d; --ok:#4fd1a1; --ok-soft:#12322a; --warn:#f2a65a; --warn-soft:#3a2614;
      --soon:#b3a8f0; --soon-soft:#262046;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:28px 16px 80px; }
  h1 { font-size:26px; margin:0 0 4px; } h1 span { color:var(--blue); }
  .sub { color:var(--muted); margin:0 0 18px; }

  .top { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 12px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .meter { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 0 4px; }
  .meter i { display:block; height:100%; background:var(--ok); width:0; transition:width .5s; }
  .who { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:14px; }

  h2 { font-size:18px; margin:26px 0 2px; }
  h2 + .q { color:var(--muted); margin:0 0 10px; font-size:14px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .card.done { border-color:var(--ok); }
  .card.soon { opacity:.78; }
  .head { display:flex; justify-content:space-between; gap:10px; align-items:start; }
  .title { font-weight:700; font-size:16px; }
  .scope { color:var(--muted); font-size:14px; margin:2px 0 8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .chip { font-size:12px; font-weight:600; border-radius:999px; padding:3px 9px; background:var(--blue-soft); color:var(--blue); white-space:nowrap; }
  .chip.ok { background:var(--ok-soft); color:var(--ok); }
  .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .chip.soon { background:var(--soon-soft); color:var(--soon); }
  .chip.lvl { background:transparent; border:1px solid var(--line); color:var(--muted); }

  .ev { display:grid; gap:6px; margin:6px 0 8px; }
  .ev div { background:var(--ok-soft); color:var(--ok); border-radius:10px; padding:8px 12px; font-weight:600; font-size:15px; }
  .ev small { display:block; color:var(--muted); font-weight:400; font-size:12px; }

  .act { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, .btn { font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--blue); border:0; border-radius:10px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  input, select { font:inherit; font-size:15px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0; }
  input[dir=ltr] { text-align:left; }
  .err { color:var(--warn); font-size:14px; }
  .act .muted { flex-basis:100%; }

  .qs { display:grid; gap:10px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .qrow { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .opts { display:flex; gap:4px; }
  .opts button { background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:4px 10px; font-weight:500; }
  .opts button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
</style>
</head>
<body>
<main>
  <h1><span>Creds</span> · כל מקורות האימות</h1>
  <p class="sub">כל מקור הוא אישור אחד. מה שלא תחבר פשוט לא יוצג, ואין "חסר".</p>

  <div class="top">
    <div class="who" id="who">
      <input id="name" placeholder="שם לתצוגה" value="נועה לוי">
      <button id="create">צור פרופיל</button>
    </div>
    <div class="meter"><i id="bar"></i></div>
    <div class="muted" id="pct">צרי פרופיל כדי להתחיל</div>
  </div>

  <div id="list"></div>
</main>

<script>
// ---------- static catalogue: cube order, and sources that exist only as plans ----------
const KINDS = [
  { key: "identity",   title: "זהות",              q: "הוא מי שהוא אומר?" },
  { key: "work",       title: "עבודה ויציבות",     q: "עובד? ממתי?" },
  { key: "home",       title: "מגורים ותשלומים",   q: "גר שם? שילם?" },
  { key: "reference",  title: "ממליצים",           q: "מי שהכיר אותו מאשר?" },
  { key: "reputation", title: "מוניטין ורישיונות", q: "מה כבר נצבר?" },
  { key: "presence",   title: "נוכחות דיגיטלית",   q: "חשבון אמיתי? ותיק? (אימות, לא ניקוד)" },
];
const METHOD_HE = { oauth: "אישור", guided: "הורדה מונחית", vendor: "קוד / ספק", referee: "ממליץ", link: "קישור", internal: "בדיקה שלנו" };

const PLANNED = [
  { kind: "identity", title: "תעודת זהות + סלפי", scope: "אדם אמיתי, שם ושנת לידה. התמונות לא נשמרות.", method: "vendor", level: 4, cost: "$0.8–3 לבדיקה" },
  { kind: "identity", title: "תמצית רישום (חבילת ממשלה)", scope: "שם, שנת לידה, עיר רשומה. מסמך חתום דיגיטלית.", method: "guided", level: 4, cost: "חינם" },
  { kind: "work", title: "טופס 106 (חבילת ממשלה)", scope: "מעסיק וטווח שכר שנתי, עד 6 שנים אחורה.", method: "guided", level: 4, cost: "חינם" },
  { kind: "work", title: "מייל עבודה", scope: "לוחצים על קישור שנשלח למייל בעבודה. מוכיח שליטה בדומיין.", method: "referee", level: 3, cost: "חינם" },
  { kind: "work", title: "רשם החברות", scope: "המעסיק הוא חברה פעילה. בודקים לבד, בלי פעולה שלך.", method: "internal", level: 4, cost: "חינם", link: "/playground" },
  { kind: "home", title: "נסח טאבו", scope: "המשכיר בחוזה הוא הבעלים הרשום.", method: "internal", level: 4, cost: "₪17" },
  { kind: "home", title: "ארנונה / חשמל", scope: "גר בכתובת מאז תאריך.", method: "guided", level: 2, cost: "חינם" },
  { kind: "reputation", title: "רישיון מקצועי", scope: "רופא, רו\"ח, מתווך, שמאי, עו\"ס, קבלן: רישיון בתוקף. בודקים לבד, בלי פעולה שלך.", method: "internal", level: 4, cost: "חינם", link: "/playground" },
  { kind: "reputation", title: "Airbnb", scope: "ביקורות כאורח.", method: "link", level: 2, cost: "חינם" },
  { kind: "presence", title: "Instagram (פיד בלבד)", scope: "הפוסטים שלך מוצגים בעמוד. תצוגה, לא הוכחה.", method: "oauth", level: 0, cost: "חינם" },
];
const ROLES = { landlord: "משכיר קודם", employer: "מעסיק", roommate: "שותף לדירה", client: "לקוח" };

// ---------- helpers ----------
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : null;
  if (!r.ok) throw new Error(body?.detail || `שגיאה ${r.status}`);
  return body;
};
const post = (path, body = {}) => api(path, { method: "POST", body: JSON.stringify(body) });

let pid = new URLSearchParams(location.search).get("person");
try { pid = pid || localStorage.getItem("creds.pid"); } catch {}
let sources = [], evidence = [];

function chips(items) {
  const c = el("div", "chips");
  for (const [text, cls] of items) if (text) c.append(el("span", "chip " + (cls || ""), text));
  return c;
}

function card({ title, scope, done, soon, chipList }) {
  const c = el("section", "card" + (done ? " done" : "") + (soon ? " soon" : ""));
  const h = el("div", "head");
  h.append(el("div", "title", title));
  c.append(h, el("div", "scope", scope), chips(chipList));
  return c;
}

function evidenceBlock(rows) {
  const box = el("div", "ev");
  for (const e of rows) {
    const d = el("div", null, e.display);
    d.append(el("small", null, `דרגה ${e.proof_level} · פג ${e.expires_at.slice(0, 10)}`));
    box.append(d);
  }
  return box;
}

// ---------- one card per real connector ----------
function connectorCard(s) {
  const mine = evidence.filter(e => e.source === s.key);
  const status = mine.length ? ["✔ חובר", "ok"] : s.ready ? ["מוכן", ""] : ["לא מוכן", "warn"];
  const c = card({
    title: s.title, scope: s.scope, done: mine.length > 0,
    chipList: [status, [METHOD_HE[s.method] || s.method, ""], [`עד דרגה ${s.max_proof_level}`, "lvl"]],
  });
  if (mine.length) c.append(evidenceBlock(mine));
  if (!s.ready) { c.append(el("div", "err", s.not_ready_reason)); return c; }
  if (s.note) c.append(el("div", "muted", s.note));

  const act = el("div", "act"), err = el("div", "err");
  const needPid = () => { if (!pid) throw new Error("קודם צרי פרופיל למעלה"); };

  if (s.key === "id.phone") {
    const phone = el("input"); phone.placeholder = "050-1234567"; phone.dir = "ltr"; phone.inputMode = "tel";
    const send = el("button", null, mine.length ? "אמת מחדש" : "שלח קוד");
    const code = el("input"); code.placeholder = "קוד"; code.dir = "ltr"; code.inputMode = "numeric"; code.hidden = true;
    code.autocomplete = "one-time-code";  // phone offers the SMS code above the keyboard
    const verify = el("button", null, "אמת"); verify.hidden = true;
    send.onclick = async () => {
      try { needPid(); const r = await post(`/persons/${pid}/connect/id.phone/start`, { phone: phone.value });
        code.hidden = verify.hidden = false; code.value = r.data.dev_code || ""; code.focus();
        info.textContent = r.data.dev_code ? "מצב פיתוח: הקוד מולא לבד" : `נשלח SMS ל-${r.data.sent_to}`; err.textContent = "";
        // Android Chrome: read the code straight from the SMS (WebOTP), no typing
        if (!r.data.dev_code && "OTPCredential" in window) {
          navigator.credentials.get({ otp: { transport: ["sms"] } }).then(o => { if (o?.code) { code.value = o.code; verify.click(); } }).catch(() => {});
        }
      } catch (e) { err.textContent = e.message; }
    };
    verify.onclick = async () => {
      try { await post(`/persons/${pid}/connect/id.phone/complete`, { code: code.value }); render(); }
      catch (e) { err.textContent = e.message; }
    };
    const info = el("div", "muted");
    act.append(phone, send, code, verify, info);
  } else if (s.method === "oauth" && s.key === "soc.telegram") {
    if (pid) {
      post(`/persons/${pid}/connect/soc.telegram/start`).then(st => {
        const sc = document.createElement("script");
        sc.src = "https://telegram.org/js/telegram-widget.js?22";
        sc.dataset.telegramLogin = st.data.bot_username;
        sc.dataset.size = "large";
        sc.dataset.authUrl = `${st.data.callback_url}?person=${pid}`;
        act.append(sc);
      }).catch(e => { err.textContent = e.message; });
    } else act.append(el("span", "muted", "צרי פרופיל כדי לחבר"));
  } else if (s.method === "oauth") {
    const b = el("button", null, mine.length ? "חבר מחדש" : `חבר ${s.title}`);
    b.onclick = async () => {
      try { needPid(); const st = await post(`/persons/${pid}/connect/${s.key}/start`); location.href = st.data.url; }
      catch (e) { err.textContent = e.message; }
    };
    act.append(b);
  }

  if (mine.length) {
    const off = el("button", "ghost", "נתק ומחק");
    off.onclick = async () => { await api(`/persons/${pid}/sources/${s.key}`, { method: "DELETE" }); render(); };
    act.append(off);
  }
  c.append(act, err);
  return c;
}

// ---------- referees: create a request, and answer it here for testing ----------
function refereeCard() {
  const mine = evidence.filter(e => e.kind === "reference");
  const c = card({
    title: "ממליצים", done: mine.length > 0,
    scope: "משכיר, מעסיק, שותף או לקוח עונים על שאלות סגורות. בלי הרשמה ובלי טקסט חופשי.",
    chipList: [mine.length ? ["✔ חובר", "ok"] : ["מוכן", ""], ["ממליץ", ""], ["עד דרגה 4", "lvl"]],
  });
  if (mine.length) c.append(evidenceBlock(mine));
  const act = el("div", "act"), err = el("div", "err");
  const role = el("select"); for (const [k, v] of Object.entries(ROLES)) { const o = el("option", null, v); o.value = k; role.append(o); }
  const name = el("input"); name.placeholder = "שם הממליץ";
  const contact = el("input"); contact.placeholder = "טלפון או מייל"; contact.dir = "ltr";
  const go = el("button", null, "צור בקשה");
  const qs = el("div", "qs"); qs.hidden = true;
  go.onclick = async () => {
    try {
      if (!pid) throw new Error("קודם צרי פרופיל למעלה");
      const r = await post(`/persons/${pid}/referees`, { role: role.value, name: name.value, contact: contact.value });
      const form = await api(r.link);
      showQuestions(qs, r.link, form, err);
    } catch (e) { err.textContent = e.message; }
  };
  act.append(role, name, contact, go);
  c.append(act, err, qs);
  return c;
}

function showQuestions(box, link, form, err) {
  box.hidden = false; box.replaceChildren(el("div", "muted", `כך זה נראה אצל הממליץ (בדיקה): שאלות על ${form.about}. מותר לדלג.`));
  const answers = {};
  for (const q of form.questions) {
    const row = el("div", "qrow"); row.append(el("span", null, q.he));
    const opts = el("div", "opts");
    const choices = q.type === "scale5" ? [1, 2, 3, 4, 5].map(n => [String(n), n]) : [["כן", true], ["לא", false]];
    for (const [label, val] of choices) {
      const b = el("button", null, label);
      b.onclick = () => { answers[q.id] = val; opts.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); };
      opts.append(b);
    }
    row.append(opts); box.append(row);
  }
  const send = el("button", null, "שלח תשובות");
  send.onclick = async () => { try { await post(link, answers); render(); } catch (e) { err.textContent = e.message; } };
  box.append(send);
}

function plannedCard(p) {
  const c = card({
    title: p.title, scope: p.scope, soon: !p.link,
    chipList: [p.link ? ["אפשר לנסות", "ok"] : ["בקרוב", "soon"], [METHOD_HE[p.method], ""],
               [p.level ? `עד דרגה ${p.level}` : "תצוגה בלבד", "lvl"], [p.cost, "lvl"]],
  });
  if (p.link) {
    const act = el("div", "act"), a = el("a", "btn", "חפש במאגרים ←");
    a.href = p.link; a.target = "_blank";
    act.append(a); c.append(act);
  }
  return c;
}

// ---------- page ----------
async function render() {
  sources = await api("/sources");
  if (pid) {
    try {
      const me = await api(`/persons/${pid}/me`);
      evidence = me.evidence;
      document.getElementById("bar").style.width = me.completeness.percent + "%";
      document.getElementById("pct").textContent =
        `${me.completeness.percent}% מהקוביות הוכחו · ${evidence.length} ראיות · מד שלמות, לא ציון · פרופיל ${pid.slice(0, 8)}`;
      document.getElementById("create").textContent = "פרופיל חדש";
    } catch { pid = null; try { localStorage.removeItem("creds.pid"); } catch {} }
  }
  const list = document.getElementById("list");
  list.replaceChildren();
  for (const k of KINDS) {
    list.append(el("h2", null, k.title), el("div", "q", k.q));
    for (const s of sources.filter(s => s.kind === k.key)) list.append(connectorCard(s));
    if (k.key === "reference") list.append(refereeCard());
    for (const p of PLANNED.filter(p => p.kind === k.key)) list.append(plannedCard(p));
  }
}

document.getElementById("create").onclick = async () => {
  const p = await post("/persons", { display_name: document.getElementById("name").value || "ללא שם" });
  pid = p.id;
  try { localStorage.setItem("creds.pid", pid); } catch {}
  history.replaceState(null, "", "/demo");
  render();
};

render();
</script>
</body>
</html>
